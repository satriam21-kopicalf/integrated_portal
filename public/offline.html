<!doctype html>
<html lang="id">
<head>

  <meta name="theme-color" content="#ffffff">
  <title>Offline - Kopi Calf</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; background: #f8fafc; color: #0f172a; }
    main { max-width: 360px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 18px; margin: 16px 0 6px; }
    p { font-size: 14px; line-height: 1.5; color: #64748b; margin: 0 0 20px; }
    button { border: 0; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; background: #1d4ed8; color: #fff; }
    @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f1f5f9; } p { color: #94a3b8; } }

</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Kopi Calf">

    <button type="button" onclick="location.reload()">Coba lagi</button>

</html>
